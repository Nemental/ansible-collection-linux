---
- name: "Manage logrotate config {{ config.name }}"
  community.general.logrotate:
    name: "{{ logrotatemgmt_config_prefix }}{{ config.name }}"
    config_dir: "{{ logrotatemgmt_config_dir }}"
    state: present
    paths: "{{ config.paths }}"
    rotation_period: "{{ config.rotation_period | default(omit) }}"
    rotate_count: "{{ config.rotate_count | default(omit) }}"
    max_size: "{{ config.max_size | default(omit) }}"
    compress: "{{ config.compress | default(omit) }}"
    delay_compress: "{{ config.delay_compress | default(omit) }}"
    missing_ok: "{{ config.missing_ok | default(omit) }}"
    not_if_empty: "{{ config.not_if_empty | default(omit) }}"
    date_ext: "{{ config.date_ext | default(omit) }}"
    create: "{{ config.create | default(omit) }}"
    shared_scripts: "{{ config.shared_scripts | default(omit) }}"
    pre_rotate: "{{ config.pre_rotate | default(omit) }}"
    post_rotate: "{{ config.post_rotate | default(omit) }}"
    su: "{{ config.su | default(omit) }}"
